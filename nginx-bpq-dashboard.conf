# =============================================================================
# dashboard.example.com — Nginx Server Block with Security Hardening
# Root: /var/www/bpq-dashboard
# PHP: 8.3 via unix socket — change every "php8.3-fpm.sock" to your version's
#      socket (ls /run/php/ ; e.g. php8.5-fpm.sock). Use the versioned name,
#      not the generic php-fpm.sock (missing on some systems -> 502).
# Covers: BPQDASH Network Monitor, BPQ Dashboard, PDF/VARA file serving
# =============================================================================
#
# INSTALLATION:
#   Replace your existing dashboard.example.com server block with this one.
#   Then: sudo nginx -t && sudo systemctl reload nginx
#
# =============================================================================

# ── Rate limiting zones (defined outside server block) ───────────────────────
# Standard zone for general requests
limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=10r/s;

# Stricter zone for PHP API endpoints
limit_req_zone $binary_remote_addr zone=dashboard_api:10m rate=5r/s;

# High-rate zone for log file serving (dashboard fetches many files in parallel)
limit_req_zone $binary_remote_addr zone=dashboard_logs:10m rate=100r/s;

server {
    server_name dashboard.example.com;
    root /var/www/bpq-dashboard;

    # ── Security Headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Disable directory listing ────────────────────────────────────────────
    autoindex off;

    # ── Rate-limit responses (2026-10-19) ────────────────────────────────────
    # nginx answers a rate-limited request with 503 by default, which looks
    # exactly like an outage. 429 "Too Many Requests" says what happened, and
    # "warn" keeps the "limiting requests" lines out of the error level.
    limit_req_status    429;
    limit_req_log_level warn;

    # ── Default: index files ─────────────────────────────────────────────────
    location / {
        index index.php index.html;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── ADMIN: login required for /admin/ and install-check.php ──────────────
    # 2026-10-03: this template had no admin login at all, and
    # set-permissions.sh installs it. Create the login file first:
    #   sudo htpasswd -cB /etc/nginx/.bpq-mgmt-auth admin     # FIRST TIME ONLY
    #   sudo chown root:www-data /etc/nginx/.bpq-mgmt-auth && sudo chmod 640 /etc/nginx/.bpq-mgmt-auth
    # (If the file is missing, or root-only so www-data can't read it, nginx
    # answers 500 here, i.e. it fails closed.)
    location ^~ /admin/ {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        location ~ \.php$ {
            auth_basic           "BPQ Dashboard Admin";
            auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
            fastcgi_param BPQ_WEB_LOGIN $remote_user;   # 2026-10-04 login signal
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
        try_files $uri =404;
    }
    location ~ ^/(bpq-maintenance|firewall-status|log-viewer|system-audit)\.html$ {
        return 301 /admin/$1.html;
    }
    location ~ ^/(install-check|health-check)\.php$ {   # health-check: 2026-10-20
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        fastcgi_param BPQ_WEB_LOGIN $remote_user;   # 2026-10-04 login signal
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # ── LOGIN: everything that reads your mail or acts as the station ────────
    # 2026-10-04 endpoint lockdown (from live 2026-10-03). Same login as
    # /admin/. The PHP refuses these too unless nginx passes BPQ_WEB_LOGIN.
    location ~ ^/(bbs-messages|bpq-chat)\.html$ {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        try_files $uri =404;
    }
    location = /bbs-messages.php {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffering off;   # large list_all answers were truncated with buffering on
        fastcgi_param BPQ_WEB_LOGIN $remote_user;   # 2026-10-04 login signal
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/(message-storage|nws-bbs-post|nts-forwarding-report)\.php$ {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_param BPQ_WEB_LOGIN $remote_user;   # 2026-10-04 login signal
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location = /bpq-chat.php {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        fastcgi_read_timeout 90s;
        fastcgi_send_timeout 90s;
        fastcgi_param BPQ_WEB_LOGIN $remote_user;   # 2026-10-04 login signal
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/(station-storage|bpq-aprs|callsign-lookup)\.php$ {
        limit_except GET {   # writes need the login; reads stay public for the maps
            auth_basic           "BPQ Dashboard Admin";
            auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        }
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
        fastcgi_param BPQ_WEB_LOGIN $remote_user;   # 2026-10-04 login signal
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # ── YAPP files received by the Telnet Client (2026-10-04) ────────────────
    # Sent to this station by another station, so untrusted: admin login,
    # never run as PHP (^~ stops the .php regex), always a download.
    location ^~ /yapp-files/ {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition     "attachment" always;
        add_header X-Content-Type-Options  "nosniff" always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;
        add_header X-Frame-Options         "DENY" always;
        add_header X-Robots-Tag            "noindex, nofollow" always;
        add_header Cache-Control           "private, no-store" always;
        try_files $uri =404;
    }

    # ── Telnet Client + VARA HF Terminal (2026-10-25) ────────────────────────
    # Pages, NetROM list and live connections behind the admin login. The VARA
    # bridge has no login of its own: without this, anyone who could reach it
    # could transmit as your station. bpq-telnet 8765 / bpq-vara 8767 listen
    # on 127.0.0.1 only.
    location ~ ^/(bpq-telnet|bpq-vara)\.html$ {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        try_files $uri =404;
    }
    location = /bpq-nodes-api.php {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ^~ /ws/telnet {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location ^~ /ws/vara {
        auth_basic           "BPQ Dashboard Admin";
        auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
        proxy_pass         http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    # ── BLOCK: Config files (CRITICAL) ───────────────────────────────────────
    location ~* /(config|bbs-config|nws-config|db-config|bpqdash-config)\.php$ {
        return 403;
    }

    # ── BLOCK: Protected directories ─────────────────────────────────────────
    location ^~ /includes/ {
        return 403;
    }
    location ^~ /scripts/ {
        return 403;
    }
    location ^~ /data/ {
        return 403;
    }
    location ^~ /cache/ {
        return 403;
    }
    location ^~ /archives/ {
        return 403;
    }

    # ── BLOCK: Hidden files (.ht, .git, .env, etc.) ─────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── BLOCK: Backup, example, and source files ─────────────────────────────
    location ~* \.(php\.example|bak|old|tmp|swp|orig|dist|md|sh|bat|yml|yaml)$ {
        return 403;
    }
    # 2026-09-26: backups with suffixes (.bak-creds, .bak.1, ...), SQL dumps, journals
    # 2026-10-10: also a digit straight after the suffix (.bak3, .old2) — a .json.bak3 was served
    location ~* \.(bak|old|orig|save|tmp|swp)[-._0-9][^/]*$ { return 403; }
    location ~* \.sql(\.gz)?$ { return 403; }
    location ~* /SESSION-JOURNAL[^/]*$ { return 403; }
    location ~* ^/logs/(?!(ConnectLog|CMSAccess)_)[^/]*\.log$ { return 403; }   # pages only read ConnectLog_/CMSAccess_ .log; daemon/app logs hold credentials
    location ~* ^/[^/]+\.txt$       { return 403; }   # old BPQ logs in the web root (robots.txt is an exact match)
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
    location ~* /Telnet_[^/]*\.log$  { return 403; }   # BPQ telnet logs record logins incl. passwords (2026-10-03)
    location ~* ^/[^/]+\.(log|wrk)$  { return 403; }   # stray logs/work files in the web root
    location ~* \.cfg$               { return 403; }   # bpq32.cfg etc. hold every USER password
    # 2026-10-19: config, system, source and work files are never web content.
    # Found served from the web root: nginx configs, a sudoers file, systemd units,
    # a daemon copy with its login typed in, driver build files, editor/work copies.
    location ~* \.(conf|service|sudoers|ps1|py|pl|exp|jsx|ajd|wrk[0-9]*|html[0-9]+|save|docx?|xlsx?|zip|tar|gz|tgz|xz|o|ko|mod|c|h)$ { return 403; }
    location ~* \.before-[^/]*$ { return 403; }        # bpq-rf-connections.html.before-phase1 etc.
    location ~* \([0-9]+\)\.[^/]*$ { return 403; }     # browser-download duplicates: name(1).php, (2).html
    location ~* ^/(callsign-cache|manual-locations)\.json$ { return 403; }   # QRZ lookup data; only callsign-lookup.php reads it
    location = /logs/bbs-messages.log { return 403; }   # app log, not for the web (2026-10-03)
    location = /logs/dashboard.log    { return 403; }

    # ── ALLOW: logs/ directory (txt/log/csv/vara/js, no PHP, no listing) ───────
    # Serve permitted log file types — regex ~* beats plain prefix /logs/ for matching URIs
    location ~* ^/logs/.*\.(txt|log|csv|vara|js)$ {
        limit_req zone=dashboard_logs burst=100 nodelay;
        autoindex off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Block everything else under /logs/ (PHP, directory listings, other types)
    # Plain prefix (no ^~) so regex locations above are still evaluated first
    location /logs/ {
        autoindex off;
        return 403;
    }

    # ── ALLOW: PDF and VARA downloads ────────────────────────────────────────
    location ~* \.(pdf|vara)$ {
        expires 1h;
        try_files $uri =404;
    }

    # ── ALLOW: Static assets ─────────────────────────────────────────────────
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|map)$ {
        expires 1d;
        try_files $uri =404;
    }

    # ── PHP: Pass to PHP-FPM 8.3 ────────────────────────────────────────────
    location ~ \.php$ {
        # snippets/fastcgi-php.conf already does "try_files $fastcgi_script_name =404"
        # (a second try_files here made "nginx -t" fail — fixed 2026-10-03)
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # ── SSL (managed by Certbot) ─────────────────────────────────────────────
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ── HTTP → HTTPS redirect (managed by Certbot) ──────────────────────────────
server {
    if ($host = dashboard.example.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name dashboard.example.com;
    return 404;
}
