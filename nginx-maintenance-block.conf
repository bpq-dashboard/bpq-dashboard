# Optional second layer: admin pages reachable from your LAN only.
#
# The admin login (location ^~ /admin/ with auth_basic) is the required
# protection — see bpq-dashboard.conf or the block install.sh writes.
# To ALSO limit the admin pages to your local network, put these lines
# INSIDE that existing block, next to the auth_basic lines. Don't add a
# second "location ^~ /admin/" (nginx refuses duplicate locations).
#
#     location ^~ /admin/ {
#         auth_basic           "YOURCALL Admin";
#         auth_basic_user_file /etc/nginx/.bpq-mgmt-auth;
#
#         allow 10.0.0.0/8;          # adjust to your LAN ranges
#         allow 172.16.0.0/12;
#         allow 192.168.0.0/16;
#         allow 127.0.0.1;
#         deny  all;
#         # (default "satisfy all": LAN address AND login are both needed)
#
#         location ~ \.php$ { ... unchanged ... }
#         try_files $uri =404;
#     }
#
# Do the same in "location = /install-check.php".
#
# (Replaces the 2026-05 version of this file, whose regex matched the old
# top-level page names and did not cover anything inside /admin/.)
