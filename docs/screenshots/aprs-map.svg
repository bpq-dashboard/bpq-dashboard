<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <!-- Page background -->
  <rect width="900" height="500" fill="#f3f4f6"/>

  <!-- Page title -->
  <text x="20" y="35" font-family="Helvetica" font-size="22" fill="#1f2937" font-weight="700">APRS Map</text>
  <text x="120" y="35" font-family="Helvetica" font-size="12" fill="#6b7280">Live stations heard through W1AW</text>

  <!-- Status indicator -->
  <circle cx="775" cy="30" r="6" fill="#16a34a"/>
  <text x="788" y="35" font-family="Helvetica" font-size="12" fill="#374151">APRS-IS connected · 247 stations</text>

  <!-- Map container with simulated map -->
  <g transform="translate(20, 55)">
    <rect width="640" height="430" rx="6" fill="#a7d7c5" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Simulated terrain — land masses -->
    <path d="M 50 80 Q 100 60, 180 80 T 300 90 L 320 130 Q 250 160, 200 145 Q 130 170, 50 150 Z" fill="#d4e9b8" opacity="0.7"/>
    <path d="M 400 60 Q 450 80, 500 70 T 600 100 L 580 200 Q 500 220, 450 200 Q 380 180, 380 120 Z" fill="#d4e9b8" opacity="0.7"/>
    <path d="M 80 250 Q 150 230, 250 250 Q 350 270, 450 260 L 480 320 Q 350 340, 250 330 Q 150 340, 80 320 Z" fill="#d4e9b8" opacity="0.7"/>
    <path d="M 350 380 Q 450 360, 550 380 L 600 410 Q 500 425, 400 415 Z" fill="#d4e9b8" opacity="0.7"/>

    <!-- Water (lakes/rivers) -->
    <ellipse cx="200" cy="200" rx="80" ry="20" fill="#88c5e8" opacity="0.6"/>
    <path d="M 300 180 Q 340 200, 380 230 Q 400 280, 380 330" fill="none" stroke="#88c5e8" stroke-width="6" opacity="0.7"/>

    <!-- Grid lines (subtle) -->
    <g stroke="#94a3b8" stroke-width="0.5" opacity="0.3">
      <line x1="0" y1="100" x2="640" y2="100"/>
      <line x1="0" y1="200" x2="640" y2="200"/>
      <line x1="0" y1="300" x2="640" y2="300"/>
      <line x1="160" y1="0" x2="160" y2="430"/>
      <line x1="320" y1="0" x2="320" y2="430"/>
      <line x1="480" y1="0" x2="480" y2="430"/>
    </g>

    <!-- Station markers -->
    <!-- Home station (W1AW) - highlighted -->
    <g transform="translate(380, 270)">
      <circle r="14" fill="#7c3aed" opacity="0.3"/>
      <circle r="9" fill="#7c3aed"/>
      <circle r="5" fill="white"/>
      <text x="0" y="-18" font-family="Helvetica" font-size="11" fill="#5b21b6" text-anchor="middle" font-weight="700">W1AW</text>
    </g>

    <!-- Various stations -->
    <!-- Mobile car -->
    <g transform="translate(180, 160)">
      <circle r="6" fill="#dc2626"/>
      <text x="0" y="-10" font-family="Helvetica" font-size="9" fill="#7f1d1d" text-anchor="middle" font-weight="600">K0ABC-9</text>
    </g>
    <g transform="translate(440, 110)">
      <circle r="6" fill="#dc2626"/>
      <text x="0" y="-10" font-family="Helvetica" font-size="9" fill="#7f1d1d" text-anchor="middle" font-weight="600">WB9XYZ-9</text>
    </g>

    <!-- Fixed stations -->
    <g transform="translate(250, 120)">
      <rect x="-6" y="-6" width="12" height="12" fill="#2563eb"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#1e3a8a" text-anchor="middle" font-weight="600">N3MEL</text>
    </g>
    <g transform="translate(550, 180)">
      <rect x="-6" y="-6" width="12" height="12" fill="#2563eb"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#1e3a8a" text-anchor="middle" font-weight="600">W4ABC</text>
    </g>
    <g transform="translate(120, 280)">
      <rect x="-6" y="-6" width="12" height="12" fill="#2563eb"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#1e3a8a" text-anchor="middle" font-weight="600">KE4QCM</text>
    </g>
    <g transform="translate(490, 320)">
      <rect x="-6" y="-6" width="12" height="12" fill="#2563eb"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#1e3a8a" text-anchor="middle" font-weight="600">N5MDT</text>
    </g>

    <!-- Weather stations -->
    <g transform="translate(310, 220)">
      <polygon points="0,-7 6,4 -6,4" fill="#f59e0b"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#92400e" text-anchor="middle" font-weight="600">K0WX</text>
    </g>
    <g transform="translate(420, 360)">
      <polygon points="0,-7 6,4 -6,4" fill="#f59e0b"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#92400e" text-anchor="middle" font-weight="600">W2WX</text>
    </g>

    <!-- Digipeaters -->
    <g transform="translate(200, 90)">
      <polygon points="0,-8 7,3 0,8 -7,3" fill="#16a34a"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#14532d" text-anchor="middle" font-weight="600">WB3-3</text>
    </g>
    <g transform="translate(540, 260)">
      <polygon points="0,-8 7,3 0,8 -7,3" fill="#16a34a"/>
      <text x="0" y="-12" font-family="Helvetica" font-size="9" fill="#14532d" text-anchor="middle" font-weight="600">W9DIG-1</text>
    </g>

    <!-- Special: balloon -->
    <g transform="translate(320, 50)">
      <circle r="5" fill="#a855f7"/>
      <line x1="0" y1="5" x2="0" y2="15" stroke="#a855f7" stroke-width="1.5"/>
      <text x="0" y="-10" font-family="Helvetica" font-size="9" fill="#6b21a8" text-anchor="middle" font-weight="600">KK5-11</text>
    </g>

    <!-- Path trace for a moving mobile -->
    <g stroke="#dc2626" stroke-width="1.5" fill="none" stroke-dasharray="3 2" opacity="0.6">
      <path d="M 100 200 L 130 180 L 150 175 L 175 170 L 180 160"/>
    </g>

    <!-- Map controls (zoom) -->
    <g transform="translate(15, 15)">
      <rect width="30" height="30" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="22" font-family="Helvetica" font-size="20" fill="#374151" text-anchor="middle">+</text>
      <rect y="32" width="30" height="30" rx="4" fill="white" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="54" font-family="Helvetica" font-size="20" fill="#374151" text-anchor="middle">−</text>
    </g>

    <!-- Scale -->
    <g transform="translate(15, 400)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#1f2937" stroke-width="2"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#1f2937" stroke-width="2"/>
      <line x1="60" y1="-3" x2="60" y2="3" stroke="#1f2937" stroke-width="2"/>
      <text x="30" y="-6" font-family="Helvetica" font-size="10" fill="#1f2937" text-anchor="middle" font-weight="600">100 km</text>
    </g>
  </g>

  <!-- Filter panel (right) -->
  <g transform="translate(680, 55)">
    <rect width="200" height="430" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>

    <text x="15" y="25" font-family="Helvetica" font-size="13" fill="#1f2937" font-weight="700">Filters</text>

    <!-- Station types -->
    <text x="15" y="50" font-family="Helvetica" font-size="11" fill="#6b7280" font-weight="700">STATION TYPES</text>

    <g transform="translate(15, 60)">
      <rect width="14" height="14" rx="3" fill="#7c3aed"/>
      <text x="20" y="11" font-family="Helvetica" font-size="11" fill="#1f2937">Home station</text>
      <text x="160" y="11" font-family="Helvetica" font-size="10" fill="#6b7280">1</text>

      <rect y="20" width="14" height="14" rx="3" fill="#dc2626"/>
      <text x="20" y="31" font-family="Helvetica" font-size="11" fill="#1f2937">Mobile/vehicles</text>
      <text x="160" y="31" font-family="Helvetica" font-size="10" fill="#6b7280">87</text>

      <rect y="40" width="14" height="14" rx="3" fill="#2563eb"/>
      <text x="20" y="51" font-family="Helvetica" font-size="11" fill="#1f2937">Fixed stations</text>
      <text x="160" y="51" font-family="Helvetica" font-size="10" fill="#6b7280">102</text>

      <rect y="60" width="14" height="14" rx="3" fill="#f59e0b"/>
      <text x="20" y="71" font-family="Helvetica" font-size="11" fill="#1f2937">Weather</text>
      <text x="160" y="71" font-family="Helvetica" font-size="10" fill="#6b7280">23</text>

      <rect y="80" width="14" height="14" rx="3" fill="#16a34a"/>
      <text x="20" y="91" font-family="Helvetica" font-size="11" fill="#1f2937">Digipeaters</text>
      <text x="160" y="91" font-family="Helvetica" font-size="10" fill="#6b7280">28</text>

      <rect y="100" width="14" height="14" rx="3" fill="#a855f7"/>
      <text x="20" y="111" font-family="Helvetica" font-size="11" fill="#1f2937">Special</text>
      <text x="160" y="111" font-family="Helvetica" font-size="10" fill="#6b7280">6</text>
    </g>

    <!-- Callsign filter -->
    <text x="15" y="200" font-family="Helvetica" font-size="11" fill="#6b7280" font-weight="700">CALLSIGN FILTER</text>
    <rect x="15" y="208" width="170" height="28" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
    <text x="22" y="226" font-family="Helvetica" font-size="11" fill="#9ca3af">e.g. W1AW or W*</text>

    <!-- Time window -->
    <text x="15" y="262" font-family="Helvetica" font-size="11" fill="#6b7280" font-weight="700">TIME WINDOW</text>
    <g transform="translate(15, 270)">
      <rect width="55" height="24" rx="4" fill="#7c3aed"/>
      <text x="27" y="16" font-family="Helvetica" font-size="11" fill="white" text-anchor="middle" font-weight="600">1h</text>

      <rect x="60" width="55" height="24" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
      <text x="87" y="16" font-family="Helvetica" font-size="11" fill="#374151" text-anchor="middle">6h</text>

      <rect x="120" width="55" height="24" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
      <text x="147" y="16" font-family="Helvetica" font-size="11" fill="#374151" text-anchor="middle">24h</text>
    </g>

    <!-- Messages section -->
    <line x1="15" y1="315" x2="185" y2="315" stroke="#e5e7eb"/>
    <text x="15" y="335" font-family="Helvetica" font-size="11" fill="#6b7280" font-weight="700">RECENT MESSAGES</text>

    <g transform="translate(15, 345)">
      <text x="0" y="11" font-family="Helvetica" font-size="11" fill="#1f2937" font-weight="600">N3MEL → W1AW</text>
      <text x="0" y="25" font-family="Helvetica" font-size="10" fill="#6b7280">QSL on the meeting tonight</text>
      <text x="0" y="38" font-family="Helvetica" font-size="9" fill="#9ca3af">2 min ago</text>

      <text x="0" y="62" font-family="Helvetica" font-size="11" fill="#1f2937" font-weight="600">W1AW → KE0GB</text>
      <text x="0" y="76" font-family="Helvetica" font-size="10" fill="#6b7280">73 GL on Field Day</text>
      <text x="0" y="89" font-family="Helvetica" font-size="9" fill="#9ca3af">14 min ago</text>
    </g>
  </g>

  <text x="450" y="498" font-family="Helvetica" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">APRS Map — station markers by type, click any for details and messaging</text>
</svg>
