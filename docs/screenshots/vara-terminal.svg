<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <!-- Page background - deep terminal palette -->
  <rect width="900" height="500" fill="#080a0d"/>

  <!-- Page title -->
  <text x="20" y="35" font-family="Segoe UI, system-ui, sans-serif" font-size="22" fill="#c8d4e0" font-weight="700">VARA HF Terminal</text>

  <!-- Status pill -->
  <rect x="265" y="18" width="100" height="22" rx="11" fill="#1a4428" stroke="#22c55e" stroke-width="1"/>
  <text x="315" y="33" font-family="Helvetica" font-size="11" fill="#22c55e" text-anchor="middle" font-weight="700">● VARA Ready</text>

  <!-- Rig status pill -->
  <rect x="380" y="18" width="160" height="22" rx="11" fill="#1a1005" stroke="#e8a020" stroke-width="1"/>
  <text x="460" y="33" font-family="Helvetica" font-size="11" fill="#e8a020" text-anchor="middle" font-weight="700">Icom IC-7300 · flrig OK</text>

  <!-- Left panel: controls -->
  <g transform="translate(20, 60)">
    <rect width="280" height="420" rx="6" fill="#0f1318" stroke="#1e242e" stroke-width="1"/>

    <!-- Frequency display -->
    <text x="15" y="25" font-family="Segoe UI, sans-serif" font-size="11" fill="#4a5568" font-weight="700">FREQUENCY</text>
    <rect x="15" y="32" width="250" height="50" rx="6" fill="#050709" stroke="#1e242e" stroke-width="1"/>
    <text x="140" y="69" font-family="Courier New, monospace" font-size="26" fill="#e8a020" text-anchor="middle" font-weight="700">10.144.000</text>
    <text x="248" y="76" font-family="Helvetica" font-size="10" fill="#4a5568" text-anchor="end">MHz</text>

    <!-- Frequency presets -->
    <text x="15" y="105" font-family="Segoe UI, sans-serif" font-size="11" fill="#4a5568" font-weight="700">FREQUENCY PRESETS</text>

    <g transform="translate(15, 115)">
      <!-- Row 1: 80m, 40m -->
      <rect width="80" height="32" rx="4" fill="#161b22" stroke="#2a3340" stroke-width="1"/>
      <text x="40" y="14" font-family="Helvetica" font-size="10" fill="#4a5568" text-anchor="middle">80m</text>
      <text x="40" y="26" font-family="Courier New, monospace" font-size="11" fill="#c8d4e0" text-anchor="middle" font-weight="600">3.585</text>

      <rect x="85" width="80" height="32" rx="4" fill="#161b22" stroke="#2a3340" stroke-width="1"/>
      <text x="125" y="14" font-family="Helvetica" font-size="10" fill="#4a5568" text-anchor="middle">40m</text>
      <text x="125" y="26" font-family="Courier New, monospace" font-size="11" fill="#c8d4e0" text-anchor="middle" font-weight="600">7.105</text>

      <rect x="170" width="80" height="32" rx="4" fill="#1a1005" stroke="#e8a020" stroke-width="2"/>
      <text x="210" y="14" font-family="Helvetica" font-size="10" fill="#e8a020" text-anchor="middle" font-weight="700">30m</text>
      <text x="210" y="26" font-family="Courier New, monospace" font-size="11" fill="#e8a020" text-anchor="middle" font-weight="700">10.144</text>
    </g>

    <g transform="translate(15, 152)">
      <!-- Row 2: 20m, 17m, 15m -->
      <rect width="80" height="32" rx="4" fill="#161b22" stroke="#2a3340" stroke-width="1"/>
      <text x="40" y="14" font-family="Helvetica" font-size="10" fill="#4a5568" text-anchor="middle">20m</text>
      <text x="40" y="26" font-family="Courier New, monospace" font-size="11" fill="#c8d4e0" text-anchor="middle" font-weight="600">14.105</text>

      <rect x="85" width="80" height="32" rx="4" fill="#161b22" stroke="#2a3340" stroke-width="1"/>
      <text x="125" y="14" font-family="Helvetica" font-size="10" fill="#4a5568" text-anchor="middle">17m</text>
      <text x="125" y="26" font-family="Courier New, monospace" font-size="11" fill="#c8d4e0" text-anchor="middle" font-weight="600">18.105</text>

      <rect x="170" width="80" height="32" rx="4" fill="#161b22" stroke="#2a3340" stroke-width="1"/>
      <text x="210" y="14" font-family="Helvetica" font-size="10" fill="#4a5568" text-anchor="middle">15m</text>
      <text x="210" y="26" font-family="Courier New, monospace" font-size="11" fill="#c8d4e0" text-anchor="middle" font-weight="600">21.105</text>
    </g>

    <!-- Bandwidth -->
    <text x="15" y="208" font-family="Segoe UI, sans-serif" font-size="11" fill="#4a5568" font-weight="700">BANDWIDTH</text>
    <g transform="translate(15, 218)">
      <rect width="80" height="28" rx="4" fill="#161b22" stroke="#2a3340" stroke-width="1"/>
      <text x="40" y="18" font-family="Helvetica" font-size="11" fill="#c8d4e0" text-anchor="middle">BW500</text>

      <rect x="85" width="80" height="28" rx="4" fill="#1a1005" stroke="#e8a020" stroke-width="2"/>
      <text x="125" y="18" font-family="Helvetica" font-size="11" fill="#e8a020" text-anchor="middle" font-weight="700">BW2300</text>

      <rect x="170" width="80" height="28" rx="4" fill="#161b22" stroke="#2a3340" stroke-width="1"/>
      <text x="210" y="18" font-family="Helvetica" font-size="11" fill="#c8d4e0" text-anchor="middle">BW2750</text>
    </g>

    <!-- Callsign input -->
    <text x="15" y="275" font-family="Segoe UI, sans-serif" font-size="11" fill="#4a5568" font-weight="700">REMOTE STATION</text>
    <rect x="15" y="283" width="250" height="36" rx="4" fill="#050709" stroke="#1e242e" stroke-width="1"/>
    <text x="25" y="307" font-family="Courier New, monospace" font-size="16" fill="#c8d4e0" font-weight="700">KE0GB</text>

    <!-- Connect button -->
    <rect x="15" y="335" width="120" height="42" rx="6" fill="#22c55e"/>
    <text x="75" y="362" font-family="Helvetica" font-size="14" fill="white" font-weight="700" text-anchor="middle">⚡ Connect</text>

    <!-- End Session button -->
    <rect x="145" y="335" width="120" height="42" rx="6" fill="#0f1318" stroke="#ef4444" stroke-width="2"/>
    <text x="205" y="362" font-family="Helvetica" font-size="14" fill="#ef4444" font-weight="700" text-anchor="middle">End Session</text>

    <!-- S-meter -->
    <text x="15" y="400" font-family="Segoe UI, sans-serif" font-size="11" fill="#4a5568" font-weight="700">S-METER · S7 (+12 dB)</text>
    <rect x="15" y="408" width="250" height="6" rx="3" fill="#050709"/>
    <rect x="15" y="408" width="180" height="6" rx="3" fill="#22c55e"/>
  </g>

  <!-- Right panel: terminal -->
  <g transform="translate(310, 60)">
    <rect width="570" height="420" rx="6" fill="#050709" stroke="#1e242e" stroke-width="1"/>

    <!-- Terminal header -->
    <rect width="570" height="28" rx="6" fill="#0f1318"/>
    <text x="12" y="19" font-family="Courier New, monospace" font-size="11" fill="#22c55e" font-weight="700">● Connected to KE0GB · 10.144 MHz · BW2300</text>
    <text x="558" y="19" font-family="Courier New, monospace" font-size="11" fill="#4a5568" text-anchor="end">⏱ 2m 34s</text>

    <!-- Terminal content -->
    <g font-family="Courier New, monospace" font-size="11" fill="#b8c8d8">
      <text x="12" y="55">─── Connection Established ─────────────────────────────────</text>
      <text x="12" y="72" fill="#22d3ee">de KE0GB</text>
      <text x="12" y="89">Hello Tony, good to see you on the air this evening</text>
      <text x="12" y="106"></text>
      <text x="12" y="123" fill="#22c55e">de W1AW</text>
      <text x="12" y="140">Hi Glen — 73 GL with the new amp. How's the linkup?</text>
      <text x="12" y="157"></text>
      <text x="12" y="174" fill="#22d3ee">de KE0GB</text>
      <text x="12" y="191">Linkup time dropped from 35 to 12 seconds after</text>
      <text x="12" y="208">your config tweaks. Big improvement.</text>
      <text x="12" y="225"></text>
      <text x="12" y="242">Did you see my BBS message about NTS auto-routing?</text>
      <text x="12" y="259"></text>
      <text x="12" y="276" fill="#22c55e">de W1AW</text>
      <text x="12" y="293">Saw it, will reply with config example in a bit.</text>
      <text x="12" y="310">Need to verify on my end first.</text>
      <text x="12" y="327"></text>
      <text x="12" y="344" fill="#22d3ee">de KE0GB</text>
      <text x="12" y="361">Roger that, no rush. 73</text>
      <text x="12" y="378"></text>

      <!-- Input line with cursor -->
      <text x="12" y="400" fill="#22c55e">de W1AW&gt;</text>
      <text x="80" y="400">73 de W1AW</text>
      <rect x="160" y="389" width="8" height="14" fill="#22c55e" opacity="0.8"/>
    </g>
  </g>

  <text x="450" y="497" font-family="Helvetica" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">VARA HF Terminal — frequency control, bandwidth, callsign, live terminal session</text>
</svg>
