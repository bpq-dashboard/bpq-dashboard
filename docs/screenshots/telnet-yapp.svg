<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <!-- Page background -->
  <rect width="900" height="560" fill="#f6f8fa"/>

  <!-- Page title -->
  <text x="20" y="35" font-family="Helvetica" font-size="22" fill="#1f2937" font-weight="700">Telnet Client</text>
  <text x="170" y="35" font-family="Helvetica" font-size="12" fill="#7c3aed" font-weight="600">v1.5.16</text>

  <!-- Toolbar -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="120" height="32" rx="4" fill="#16a34a"/>
    <text x="60" y="20" font-family="Helvetica" font-size="13" fill="white" font-weight="600" text-anchor="middle">● Connected</text>

    <rect x="130" y="0" width="100" height="32" rx="4" fill="#dc2626"/>
    <text x="180" y="20" font-family="Helvetica" font-size="13" fill="white" font-weight="600" text-anchor="middle">Disconnect</text>

    <rect x="240" y="0" width="80" height="32" rx="4" fill="#7c3aed"/>
    <text x="280" y="20" font-family="Helvetica" font-size="13" fill="white" font-weight="600" text-anchor="middle">📁 YAPP</text>
  </g>

  <!-- Main terminal pane (left, dark) -->
  <g transform="translate(20, 100)">
    <rect width="540" height="430" rx="6" fill="#0a0e14" stroke="#30363d" stroke-width="1"/>
    <text x="10" y="20" font-family="Courier New, monospace" font-size="11" fill="#7d8590">─── BPQ Node W1AW ─────────────────────────────────</text>
    <text x="10" y="40" font-family="Courier New, monospace" font-size="11" fill="#a6e3a1">de W1AW&gt; BBS</text>
    <text x="10" y="58" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">[BPQ-6.0.25.26-B2FWIHJM$]</text>
    <text x="10" y="76" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">Welcome to W1AW BBS</text>
    <text x="10" y="94" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">Type ? for help</text>
    <text x="10" y="112" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">de W1AW&gt;</text>
    <text x="10" y="130" font-family="Courier New, monospace" font-size="11" fill="#a6e3a1">de W1AW&gt; Files</text>
    <text x="10" y="148" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">BPQ Setting New User Forwarding.pdf 485942</text>
    <text x="10" y="166" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">BPQ Setting New User.pdf 488793</text>
    <text x="10" y="184" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">Bulletin Flood Areas.pdf 67616</text>
    <text x="10" y="202" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">DCC1995-Recommendation4HAP.pdf 54716</text>
    <text x="10" y="220" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">Sample-Document.pdf 164130</text>
    <text x="10" y="238" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">Test 4096</text>
    <text x="10" y="256" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">install-direwolf-and-linbpq-raspbian.doc 37376</text>
    <text x="10" y="274" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">yapptest.txt 55</text>
    <text x="10" y="292" font-family="Courier New, monospace" font-size="11" fill="#cdd6f4">de W1AW&gt;</text>
    <!-- Blinking cursor -->
    <rect x="80" y="284" width="8" height="13" fill="#a6e3a1" opacity="0.8"/>
  </g>

  <!-- YAPP panel (right) -->
  <g transform="translate(580, 100)">
    <rect width="300" height="430" rx="6" fill="white" stroke="#d1d5db" stroke-width="1"/>

    <!-- Header -->
    <rect width="300" height="36" rx="6" fill="#7c3aed"/>
    <text x="15" y="24" font-family="Helvetica" font-size="13" fill="white" font-weight="700">📁 YAPP File Transfer</text>

    <!-- Tabs -->
    <rect x="0" y="36" width="300" height="38" fill="#f3f4f6"/>
    <rect x="0" y="36" width="100" height="38" fill="white" stroke="#7c3aed" stroke-width="2"/>
    <line x1="0" y1="73" x2="100" y2="73" stroke="white" stroke-width="3"/>
    <text x="50" y="60" font-family="Helvetica" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">Receive</text>
    <text x="150" y="60" font-family="Helvetica" font-size="12" fill="#6b7280" text-anchor="middle">Send</text>
    <text x="250" y="60" font-family="Helvetica" font-size="12" fill="#6b7280" text-anchor="middle">Status</text>

    <!-- Buttons row -->
    <g transform="translate(12, 84)">
      <rect width="130" height="32" rx="4" fill="#3b82f6"/>
      <text x="65" y="20" font-family="Helvetica" font-size="12" fill="white" font-weight="600" text-anchor="middle">📂 Browse Files</text>

      <rect x="138" width="130" height="32" rx="4" fill="#7c3aed"/>
      <text x="203" y="20" font-family="Helvetica" font-size="12" fill="white" font-weight="600" text-anchor="middle">🛰 Arm Receiver</text>
    </g>

    <!-- Status text -->
    <text x="12" y="135" font-family="Helvetica" font-size="11" fill="#6b7280">8 files available — click to receive</text>

    <!-- File list -->
    <g transform="translate(12, 145)">
      <rect width="276" height="240" rx="4" fill="#0e0e1c" stroke="#333" stroke-width="1"/>

      <g font-family="Courier New, monospace" font-size="10" fill="#e5e7eb">
        <rect y="0" width="276" height="28" fill="#1a1a2e"/>
        <text x="8" y="18">BPQ Setting New User Forwarding.pdf</text>
        <text x="240" y="18" font-size="9" fill="#888">474 KB</text>

        <text x="8" y="42">BPQ Setting New User.pdf</text>
        <text x="240" y="42" font-size="9" fill="#888">477 KB</text>

        <text x="8" y="66">Bulletin Flood Areas.pdf</text>
        <text x="240" y="66" font-size="9" fill="#888">66 KB</text>

        <text x="8" y="90">DCC1995-Recommendation...pdf</text>
        <text x="240" y="90" font-size="9" fill="#888">53 KB</text>

        <text x="8" y="114">Sample-Document.pdf</text>
        <text x="240" y="114" font-size="9" fill="#888">160 KB</text>

        <text x="8" y="138">Test</text>
        <text x="240" y="138" font-size="9" fill="#888">4 KB</text>

        <text x="8" y="162">install-direwolf-linbpq.doc</text>
        <text x="240" y="162" font-size="9" fill="#888">36 KB</text>

        <text x="8" y="186">yapptest.txt</text>
        <text x="240" y="186" font-size="9" fill="#888">55 B</text>
      </g>
    </g>

    <text x="12" y="410" font-family="Helvetica" font-size="10" fill="#9ca3af" font-style="italic">Click any file to start receiving</text>
  </g>

  <!-- Caption -->
  <text x="450" y="555" font-family="Helvetica" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Telnet Client showing the YAPP file transfer panel with Browse Files results</text>
</svg>
